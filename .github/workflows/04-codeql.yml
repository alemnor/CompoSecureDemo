name: 04 - CodeQL

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
